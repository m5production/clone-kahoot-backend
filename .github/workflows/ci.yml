name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clone_kahoot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clone_kahoot_test
      ALLOWED_ORIGINS: http://localhost:5173
      PORT: 3000
      TRUST_PROXY: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: yarn prisma-generate

      - name: Biome check
        run: yarn lint:ci

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy

      - name: Production build
        run: yarn build

      - name: API smoke test
        run: |
          node dist/main.js &
          for i in $(seq 1 30); do
            sleep 1
            if curl -sf http://localhost:3000/api/health/ready; then exit 0; fi
          done
          echo 'Server did not become ready' >&2
          exit 1
